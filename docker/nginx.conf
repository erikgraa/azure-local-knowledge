server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  gzip on;
  gzip_types application/json text/plain text/css application/javascript image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Fingerprinted bundles never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # The index changes nightly: always revalidate.
  location /data/ {
    add_header Cache-Control "no-cache";
    add_header Access-Control-Allow-Origin "*";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location = /Search-AzLocalKnowledge.ps1 {
    default_type text/plain;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri $uri/ /index.html;
  }
}
