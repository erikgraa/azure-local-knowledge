name: Build & deploy to GitHub Pages

# Rebuilds the index from the live sources every day, optionally enriches it with Copilot,
# and publishes the site. Requires Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main, master]
  schedule:
    - cron: '17 4 * * *' # daily, 04:17 UTC
  workflow_dispatch:
    inputs:
      max_items:
        description: 'Max items to enrich with Copilot in this run (0 = skip enrichment)'
        required: false
        default: '60'
      force_enrich:
        description: 'Ignore the enrichment cache and re-process everything (up to max_items)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  copilot-requests: write # lets the built-in GITHUB_TOKEN call Copilot (org repos, see README); unused with a PAT

# One deployment at a time; never cancel a deployment that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  ENRICH_MAX_ITEMS: ${{ inputs.max_items || '60' }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # Enrichment results and last-modified lookups are keyed by content hash, so the cache only
      # grows with *changed* documents. restore-keys picks up the most recent run's cache.
      - name: Restore enrichment cache
        uses: actions/cache@v6
        with:
          path: |
            .cache/enrichment-cache.json
            .cache/last-modified.json
            .cache/last-good-index.json
          key: enrichment-${{ github.run_id }}
          restore-keys: |
            enrichment-

      # Guardrail baseline: the index that is live right now. If GitHub or Learn are unreachable (or
      # come back suspiciously small) during this run, build-index serves that source's data from it
      # instead of publishing an empty site. A failed download is fine: the restored cache copy (if any)
      # stays in place, and on the very first deploy there is simply no baseline.
      - name: Fetch last published index (baseline)
        continue-on-error: true
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p .cache
          if curl -fsSL --retry 3 --max-time 60 "$BASE_URL/data/index.json?run=${GITHUB_RUN_ID}" -o .cache/baseline.tmp \
             && node -e "const i=JSON.parse(require('fs').readFileSync('.cache/baseline.tmp','utf8')); if(!Array.isArray(i.items)||!i.items.length) process.exit(1)"; then
            mv .cache/baseline.tmp .cache/last-good-index.json
            echo "Baseline fetched from $BASE_URL"
          else
            rm -f .cache/baseline.tmp
            echo "::notice title=No fresh baseline::Could not fetch $BASE_URL/data/index.json; using the cached copy if there is one."
          fi

      - name: Build index from live sources
        run: npm run build:index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Auth options (first match wins):
      #   1. secret COPILOT_GITHUB_TOKEN  - fine-grained PAT with "Copilot Requests" (works everywhere)
      #   2. variable COPILOT_USE_GITHUB_TOKEN=true - built-in GITHUB_TOKEN + `copilot-requests: write`
      #      (organization-owned repos whose org allows Copilot CLI billed to the organization)
      - name: Check Copilot enrichment credentials
        id: copilot
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          USE_GITHUB_TOKEN: ${{ vars.COPILOT_USE_GITHUB_TOKEN }}
        run: |
          if [ "${ENRICH_MAX_ITEMS}" = "0" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Copilot enrichment skipped::max_items is 0."
          elif [ -n "$COPILOT_GITHUB_TOKEN" ] || [ "$USE_GITHUB_TOKEN" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Copilot enrichment skipped::Add a COPILOT_GITHUB_TOKEN secret (or set the COPILOT_USE_GITHUB_TOKEN variable) to enable it - see README. Publishing parser-only data."
          fi

      - name: Install Copilot CLI
        if: steps.copilot.outputs.enabled == 'true'
        run: npm install -g @github/copilot

      # Never fails the job: on any error the deterministic index.json is deployed as-is.
      - name: Enrich index with Copilot
        if: steps.copilot.outputs.enabled == 'true'
        run: |
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then unset COPILOT_GITHUB_TOKEN; fi
          npm run enrich -- ${{ inputs.force_enrich && '--force' || '' }}
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_USE_GITHUB_TOKEN: ${{ vars.COPILOT_USE_GITHUB_TOKEN }}
          ENRICH_MODEL: ${{ vars.ENRICH_MODEL }}

      # Last line of defence: never publish an empty, invalid or implausibly small index.
      - name: Verify index before building
        run: node scripts/check-index.mjs

      - name: Build site
        run: npm run build
        env:
          # "/<repo>/" for project sites, "/" for user/org sites and custom domains.
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/

      - name: Verify built site
        run: node scripts/check-index.mjs --dist dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
