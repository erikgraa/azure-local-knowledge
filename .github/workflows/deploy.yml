name: Build & deploy to GitHub Pages

# Rebuilds the index from the live sources every day, optionally enriches it with Copilot,
# and publishes the site. Requires Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'schema/**'
      - 'scripts/**'
      - 'docker/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/deploy.yml'
  schedule:
    - cron: '17 4 * * *' # daily, 04:17 UTC
  workflow_dispatch:
    inputs:
      max_items:
        description: 'Max items to enrich with Copilot in this run (0 = skip enrichment)'
        required: false
        default: '60'
      force_enrich:
        description: 'Ignore the enrichment cache and re-process everything (up to max_items)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  copilot-requests: write # lets the built-in GITHUB_TOKEN call Copilot (org repos, see README); unused with a PAT

# One deployment at a time; never cancel a deployment that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

# Pushes only re-publish: they apply the cached enrichment but make no new Copilot calls, so usage
# does not scale with how often you merge. New enrichment runs on the daily schedule or manually.
env:
  ENRICH_MAX_ITEMS: ${{ github.event_name == 'push' && '0' || inputs.max_items || '60' }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # contents: write is only used to push the history archive to the `data` branch (never to main).
    permissions:
      contents: write
      pages: write
      id-token: write
      copilot-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # Enrichment results and last-modified lookups are keyed by content hash, so the cache only
      # grows with *changed* documents. restore-keys picks up the most recent run's cache.
      - name: Restore enrichment cache
        uses: actions/cache@v6
        with:
          path: |
            .cache/enrichment-cache.json
            .cache/last-modified.json
            .cache/last-good-index.json
          key: enrichment-${{ github.run_id }}
          restore-keys: |
            enrichment-

      # Guardrail baseline: the index that is live right now. If GitHub or Learn are unreachable (or
      # come back suspiciously small) during this run, build-index serves that source's data from it
      # instead of publishing an empty site. A failed download is fine: the restored cache copy (if any)
      # stays in place, and on the very first deploy there is simply no baseline.
      - name: Fetch last published index (baseline)
        continue-on-error: true
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p .cache
          if curl -fsSL --retry 3 --max-time 60 "$BASE_URL/data/index.json?run=${GITHUB_RUN_ID}" -o .cache/baseline.tmp \
             && node -e "const i=JSON.parse(require('fs').readFileSync('.cache/baseline.tmp','utf8')); if(!Array.isArray(i.items)||!i.items.length) process.exit(1)"; then
            mv .cache/baseline.tmp .cache/last-good-index.json
            echo "Baseline fetched from $BASE_URL"
          else
            rm -f .cache/baseline.tmp
            echo "::notice title=No fresh baseline::Could not fetch $BASE_URL/data/index.json; using the cached copy if there is one."
          fi

      # Preferred baseline: the durable archive on the `data` branch. It survives an unreachable website and
      # cache eviction, and it is what guarantees that nothing is ever dropped: items that vanish from the
      # official sources are carried forward (marked removed) from this baseline. The newer of archive and
      # website copy wins.
      - name: Load archive baseline (data branch)
        continue-on-error: true
        run: node scripts/archive.mjs load

      - name: Build index from live sources
        run: npm run build:index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Auth options (first match wins):
      #   1. secret COPILOT_GITHUB_TOKEN  - fine-grained PAT with "Copilot Requests" (works everywhere)
      #   2. variable COPILOT_USE_GITHUB_TOKEN=true - built-in GITHUB_TOKEN + `copilot-requests: write`
      #      (organization-owned repos whose org allows Copilot CLI billed to the organization)
      - name: Check Copilot enrichment credentials
        id: copilot
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          USE_GITHUB_TOKEN: ${{ vars.COPILOT_USE_GITHUB_TOKEN }}
        run: |
          if [ "${ENRICH_MAX_ITEMS}" = "0" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No new Copilot calls::${{ github.event_name }} run: publishing with cached enrichment only (new enrichment runs on the daily schedule or via Run workflow)."
          elif [ -n "$COPILOT_GITHUB_TOKEN" ] || [ "$USE_GITHUB_TOKEN" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Copilot enrichment skipped::Add a COPILOT_GITHUB_TOKEN secret (or set the COPILOT_USE_GITHUB_TOKEN variable) to enable it - see README. Publishing with cached enrichment only."
          fi

      - name: Install Copilot CLI
        if: steps.copilot.outputs.enabled == 'true'
        run: npm install -g @github/copilot

      # Always runs so cached enrichment is applied to every published index; it only calls Copilot when
      # enabled above. Never fails the job: on any error the deterministic index.json is deployed as-is.
      - name: Apply and refresh Copilot enrichment
        run: |
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then unset COPILOT_GITHUB_TOKEN; fi
          npm run enrich -- ${{ inputs.force_enrich && '--force' || '' }}
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_USE_GITHUB_TOKEN: ${{ vars.COPILOT_USE_GITHUB_TOKEN }}
          ENRICH_MODEL: ${{ vars.ENRICH_MODEL }}
          ENRICH_MAX_ITEMS: ${{ steps.copilot.outputs.enabled == 'true' && env.ENRICH_MAX_ITEMS || '0' }}

      # Last line of defence: never publish an empty, invalid or implausibly small index.
      - name: Verify index before building
        run: node scripts/check-index.mjs

      - name: Build site
        run: npm run build
        env:
          # "/<repo>/" for project sites, "/" for user/org sites and custom domains.
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/

      - name: Verify built site
        run: node scripts/check-index.mjs --dist dist

      # The container serves the site from "/", whatever base Pages uses, so it gets its own build of the
      # same sources. These steps never block the Pages deploy; if one fails the container job fails instead.
      - name: Build site for the container image
        continue-on-error: true
        run: npx vite build --base=/ --outDir dist-container

      - name: Verify container site
        continue-on-error: true
        run: node scripts/check-index.mjs --dist dist-container

      - name: Upload container site
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: site-container
          path: dist-container
          retention-days: 1
          if-no-files-found: error

      # Only reached when every check above passed. Commits a snapshot to the `data` branch when the content
      # changed (removed-upstream items included). A failure here must not block the deploy.
      - name: Archive the index (data branch)
        continue-on-error: true
        run: node scripts/archive.mjs publish

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Packages the exact site that was just indexed (and verified) into a self-contained image on GHCR.
  # Runs after every build, so the image is refreshed by the nightly index. A failure here never blocks Pages.
  container:
    name: Publish container image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install verification dependencies
        run: npm ci

      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: site-container
          path: dist-container

      - name: Verify downloaded container site
        run: node scripts/check-index.mjs dist-container/data/index.json --dist dist-container

      - name: Read index date
        id: index
        run: |
          echo "date=$(node -p "new Date(JSON.parse(require('fs').readFileSync('dist-container/data/index.json','utf8')).generatedAt).toISOString().slice(0,10)")" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.index.outputs.date }}
            type=sha,prefix=sha-

      # Build and smoke-test the native architecture before publishing anything.
      - name: Build (amd64) and smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: azl-smoke:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: bash docker/smoke.sh azl-smoke:test

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.index.outputs.date }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.index.outputs.created }}
          cache-from: type=gha

      - name: Retain 30 days of dated and SHA container versions
        run: node scripts/container-retention.mjs --apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
