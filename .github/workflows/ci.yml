name: CI

on:
  push:
    branches-ignore: [gh-pages, data]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (parsers, search, enrichment)
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (if configured)
        run: npm run --if-present lint

      # Offline fixtures keep PRs deterministic and independent of the live GitHub / Learn sources.
      - name: Build index from fixtures
        run: npm run build:index -- --fixtures

      - name: Build site
        run: npm run build

      - name: Upload site preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-preview
          path: dist
          retention-days: 7
          if-no-files-found: error
